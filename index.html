<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Contact Form</title>
  </head>
  <body>
    <div class="form-container">
      <h2 class="form-header">Contact form</h2>
      <div class="about-form">
        Please fiil in your information and we'll besending your order.
      </div>
      <form action="">
        <fieldset>
          <span>Your name</span>
          <div class="inputs-row">
            <label>
              <input
                type="text"
                name="first-name"
                placeholder="first name"
                pattern="[A-Z][a-z]{1,19}(-[A-Z][a-z]{1,19})?"
                tabindex="1"
              />
            </label>
            <label>
              <input
                type="text"
                name="last-name"
                placeholder="last name"
                pattern="[A-Z][a-z]{1,19}(-[A-Z][a-z]{1,19})?"
                tabindex="2"
              />
            </label>
          </div>
        </fieldset>
        <label>
          <span>Your email</span>
          <input
            class="inputs"
            type="email"
            name="email"
            placeholder="your_mail@mail.com"
            tabindex="3"
          />
        </label>
        <fieldset>
          <span>Phone *</span>
          <div class="inputs-row">
            <label>
              <input
                type="tel"
                name="tel1"
                placeholder="000"
                pattern="380"
                required
                tabindex="4"
              />
            </label>
            <label>
              <input
                type="tel"
                name="tel2"
                placeholder="000"
                pattern="\d{3}"
                required
                tabindex="5"
              />
            </label>
            <label>
              <input
                type="tel"
                name="tel3"
                placeholder="0000"
                pattern="\d{4}"
                required
                tabindex="6"
              />
            </label>
          </div>
        </fieldset>
        <label>
          <span>Message subject *</span>
          <select class="inputs" name="subject" required tabindex="7">
            <option value="other">Other</option>
            <option value="appeal">Appeal</option>
            <option value="question">Question</option>
            <option value="comment">Comment</option>
          </select>
        </label>
        <label>
          <span>Message *</span>
          <textarea
            class="inputs"
            name="message"
            required
            tabindex="8"
          ></textarea>
        </label>
        <button class="submit-btn" type="submit">SUBMIT FORM</button>
      </form>
    </div>
  </body>
</html>
